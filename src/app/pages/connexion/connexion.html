
<body>
  <div id="container">
    <div id="image">
      <img src="/img/fac3-removebg-preview.png" alt="Image de fond">
    </div>

    <div id="formulaire">
      <div id="logo">
        <img src="/img/acaps logo.png" alt="logo ACAPS" />
        <h1>ACAPSFacture</h1>
      </div>

      <h1>Connexion au compte</h1>
      <p>
        Bienvenue dans votre espace sécurisé <strong>ACAPSFacture</strong>.<br>
        Pour accéder à votre compte, merci de vous identifier.
      </p>

      <form (ngSubmit)="login()">
  <label for="email">Email *:</label>
  <input type="email" id="email" name="email" [(ngModel)]="email" required />

  <label for="password">Mot de passe *:</label>
  <input type="password" id="password" name="password" [(ngModel)]="password" required />

  <button type="submit">Se connecter</button>
</form>


      <ul id="hh">
        <li><a href="#">Mot de passe oublié ?</a></li>
        <li><a routerLink="/signUp">Vous n'avez pas de compte ? Créer un compte</a></li>
      </ul>
    </div>
  </div>
</body>
