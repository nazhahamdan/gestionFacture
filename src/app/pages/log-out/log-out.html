<div class="logout-container">
  <div class="logout-card">
    <h1>Voulez-vous vraiment vous déconnecter ?</h1>
    <p>
      La déconnexion entraînera la perte de toutes vos données non sauvegardées
      et de l'historique de votre session. Assurez-vous d'avoir enregistré
      toutes les informations importantes avant de continuer.
    </p>
    <button class="btn" (click)="deconnexion()">Se déconnecter</button>
  </div>
</div>
